</style></head><body>

<script>
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)]; const escapeHtml=v=>String(v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
let activeSelectPortal=null,selectPortalFrame=0;
function restoreSelectMenu(wrapper){if(!wrapper)return;const menu=wrapper._mfsMenu,trigger=wrapper._mfsTrigger;if(!menu)return;menu.classList.remove('portal-open','portal-above');menu.removeAttribute('style');if(menu.parentNode!==wrapper)wrapper.appendChild(menu);trigger?.setAttribute('aria-expanded','false');wrapper.classList.remove('open');if(activeSelectPortal===wrapper)activeSelectPortal=null}
function closeCustomSelects(except=null){$$('.mfs-select.open').forEach(w=>{if(w!==except)restoreSelectMenu(w)})}
function positionSelectPortal(wrapper){const trigger=wrapper._mfsTrigger,menu=wrapper._mfsMenu,rect=trigger.getBoundingClientRect(),vw=innerWidth,vh=innerHeight,margin=10,gap=6,width=Math.min(Math.max(rect.width,150),vw-margin*2);let left=Math.max(margin,Math.min(rect.left,vw-margin-width));let below=vh-rect.bottom-gap-margin,above=rect.top-gap-margin,up=below<180&&above>below,available=Math.max(110,up?above:below);Object.assign(menu.style,{position:'fixed',left:Math.round(left)+'px',right:'auto',width:Math.round(width)+'px',maxHeight:Math.min(300,Math.floor(available))+'px',top:up?'auto':Math.round(rect.bottom+gap)+'px',bottom:up?Math.round(vh-rect.top+gap)+'px':'auto'});menu.classList.toggle('portal-above',up)}
function openSelectPortal(w){closeCustomSelects(w);const m=w._mfsMenu,t=w._mfsTrigger;w.classList.add('open');document.body.appendChild(m);m.classList.add('portal-open');activeSelectPortal=w;positionSelectPortal(w)}
function enhanceSelect(select){const w=document.createElement('div');w.className='mfs-select';select.parentNode.insertBefore(w,select);w.appendChild(select);select.classList.add('mfs-native-select');const t=document.createElement('button');t.type='button';t.className='mfs-select-trigger';t.innerHTML='<span class="mfs-select-value"></span><span class="mfs-select-chevron">⌄</span>';const m=document.createElement('div');m.className='mfs-select-menu mfs-select-portal';w.append(t,m);w._mfsMenu=m;w._mfsTrigger=t;function refresh(){t.querySelector('.mfs-select-value').textContent=select.options[select.selectedIndex].textContent;m.innerHTML=[...select.options].map(o=>'<button class="mfs-select-option'+(o.selected?' selected':'')+'"><span>'+o.textContent+'</span></button>').join('')}refresh();t.onclick=e=>{e.stopPropagation();openSelectPortal(w)}}
enhanceSelect($('#s')); setTimeout(()=>$('.mfs-select-trigger').click(),250);
</script></body></html>
